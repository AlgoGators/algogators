[project]
name = "algoterminal"
version = "0.0.0"
description = "AlgoGators terminal UI"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["research-core"]

[project.scripts]
algoterminal = "algoterminal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algoterminal"]
