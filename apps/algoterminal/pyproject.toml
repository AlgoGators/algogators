[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algogators-cli"
version = "0.1.0"
description = "AlgoGators CLI — a terminal research workbench for the AlgoGators Quantitative Research team"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AlgoGators Quantitative Research" }]
dependencies = [
    "textual>=0.58",
    "rich>=13.7",
    "typer>=0.12",
    "pandas>=2.1",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "plotext>=5.2",
    "matplotlib>=3.9",
    "textual-image>=0.8",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.scripts]
algogators = "algogators.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/algogators"]
