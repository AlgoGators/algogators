[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algogators-stress-test"
version = "0.1.0"
description = "Black-swan stress test of the fund's book on a day: held unchanged, and traded through by the trade-ngin strategy"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AlgoGators" }]
# The trade-ngin engine (`tradengin`) is not a dependency: only `replay` needs it, it has no
# wheel for every platform, and the tool loads whichever copy is installed or passed (--engine).
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "psycopg2-binary>=2.9.10",
]

[project.scripts]
stress-test = "stress_test.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stress_test"]
