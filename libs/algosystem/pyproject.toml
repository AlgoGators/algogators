[project]
name = "algosystem"
version = "0.1.9"
description = "A batteries-included pythonic library for AlgoGators members"
authors = [{ name = "AlgoGators Team", email = "team@algogators.org" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "sqlalchemy>=1.4.0",
    "click>=8.0.0",
    "scipy>=1.7.0",
    "requests>=2.33.0",
    "quantstats>=0.0.64,<0.1",
    # quantstats <0.0.66 imports IPython at module scope without declaring it,
    # so it must be declared here.
    "ipython>=8.18.1",
    "pyarrow>=23.0.1",
    "rich>=14.0.0,<15",
    "openpyxl>=3.1.5,<4",
    "yfinance>=0.2.61,<0.3",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.10",
    # Declared for security floors only; these are transitive at runtime.
    "pillow>=12.3.0",
    "urllib3>=2.7.0",
]

[project.urls]
homepage = "https://github.com/algogators/algogators"

[project.scripts]
algosystem = "algosystem.interfaces.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algosystem"]
