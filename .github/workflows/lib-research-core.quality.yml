name: research-core · quality

on:
  pull_request:
    paths:
      - 'libs/research-core/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/_quality-python.yml'
      - '.github/workflows/lib-research-core.quality.yml'
  push:
    branches: [main]
    paths:
      - 'libs/research-core/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/_quality-python.yml'
      - '.github/workflows/lib-research-core.quality.yml'
  workflow_dispatch:

concurrency:
  group: lib-research-core-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality-python.yml
    with:
      path: libs/research-core
      python-versions: '["3.11"]'
      runners: '["ubuntu-latest","windows-latest"]'
      coverage-min: 85
      strict-types: false
      build-check: true
    secrets: inherit

  gate:
    name: lib-research-core quality
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::quality result was ${{ needs.quality.result }}"
            exit 1
          fi
