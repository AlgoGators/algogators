name: deploy / ssh

# Reusable. Called by a service's `<kind>-<name>.publish.yml` after the image is
# published, to roll a single-box (EC2 + Docker Compose) deployment.
#
# This is the successor to the AlgoLens `git pull && npm ci && build` deploy.
# The difference that matters: the box no longer builds anything. It pulls an
# image by DIGEST that CI already built and tested, so what runs in production
# is bit-identical to what the quality gate passed — and rolling back is
# re-running this workflow with the previous digest instead of hoping a git
# checkout reproduces.

on:
  workflow_call:
    inputs:
      environment:
        description: >
          GitHub Environment holding the host secrets and any required
          reviewers. Empty uses the repository-level SSH_* secrets.
        type: string
        default: ''
      image:
        description: Image name without registry, e.g. algogators/data-ngin
        type: string
        required: true
      digest:
        description: Image digest from _publish-container.yml, e.g. sha256:abc...
        type: string
        required: true
      remote-path:
        description: >
          Directory on the host holding the compose file. With deploy-script,
          the path of a sparse checkout of this repo that is cloned on first
          use and fast-forwarded to the commit being deployed.
        type: string
        required: true
      deploy-script:
        description: >
          Repo-relative script to run (with the image ref as its argument)
          from the checkout at remote-path, instead of the built-in compose
          pull/up. The script, not this workflow, then owns the roll.
        type: string
        default: ''
      sparse-paths:
        description: Space-separated paths kept in the deploy-script checkout.
        type: string
        default: ''
      compose-file:
        type: string
        default: docker-compose.prod.yml
      service-name:
        description: Compose service to restart. Empty restarts the whole stack.
        type: string
        default: ''
      health-url:
        description: Polled after the roll. Empty skips the check.
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 20
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true

permissions:
  contents: read
  # Pull the image from GHCR on the host with this run's token.
  packages: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Roll
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: ${{ inputs.timeout-minutes }}m
          envs: IMAGE_REF,REMOTE_PATH,COMPOSE_FILE,SERVICE_NAME,GHCR_ACTOR,GHCR_TOKEN,DEPLOY_SCRIPT,SPARSE_PATHS,REPO_URL,DEPLOY_REF,DEPLOY_SHA
          script_stop: true
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            if [ -n "$DEPLOY_SCRIPT" ]; then
              # git-pull deploy: the checkout carries the compose file, cron
              # jobs and deploy script; the image carries the code.
              if [ ! -d "$REMOTE_PATH/.git" ]; then
                git clone --filter=blob:none --no-checkout --branch "$DEPLOY_REF" "$REPO_URL" "$REMOTE_PATH"
                git -C "$REMOTE_PATH" sparse-checkout set $SPARSE_PATHS
              fi
              cd "$REMOTE_PATH"
              git fetch origin "$DEPLOY_REF"
              git checkout -q "$DEPLOY_REF"
              # Exactly the commit CI built, never a newer push that raced it.
              git merge --ff-only "$DEPLOY_SHA"
              trap 'docker logout ghcr.io >/dev/null' EXIT
              bash "$DEPLOY_SCRIPT" "$IMAGE_REF"
              exit 0
            fi

            cd "$REMOTE_PATH"

            # Record what is running now, so a rollback does not need archaeology.
            docker compose -f "$COMPOSE_FILE" config --images > .previous-images || true

            echo "Deploying $IMAGE_REF"
            export IMAGE_REF
            docker compose -f "$COMPOSE_FILE" pull ${SERVICE_NAME:-}
            docker compose -f "$COMPOSE_FILE" up -d --wait --remove-orphans ${SERVICE_NAME:-}

            docker image prune -f --filter 'until=168h'
        env:
          IMAGE_REF: ghcr.io/${{ inputs.image }}@${{ inputs.digest }}
          REMOTE_PATH: ${{ inputs.remote-path }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          SERVICE_NAME: ${{ inputs.service-name }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SCRIPT: ${{ inputs.deploy-script }}
          SPARSE_PATHS: ${{ inputs.sparse-paths }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}

      - name: Health check
        if: ${{ inputs.health-url != '' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${{ inputs.health-url }}" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 5
          done
          echo "::error::${{ inputs.health-url }} never returned 200 — deploy is live but unhealthy"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed to ${{ inputs.environment }}"
            echo "- image: \`ghcr.io/${{ inputs.image }}@${{ inputs.digest }}\`"
            echo "- host path: \`${{ inputs.remote-path }}\`"
            echo "- rollback: re-run this workflow with the previous digest"
          } >> "$GITHUB_STEP_SUMMARY"
