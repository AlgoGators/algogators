name: research-api · quality

on:
  pull_request:
    paths:
      - 'services/research-api/**'
      - 'libs/research-core/**'
      - 'platform/db/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/_quality-python.yml'
      - '.github/workflows/svc-research-api.quality.yml'
      # the engine's gRPC contract, which research-api carries a copy of (the protos job)
      - 'services/trade-ngin/proto/**'
      - 'services/trade-ngin/services/rpc/gen_versions.py'
  push:
    branches: [main]
    paths:
      - 'services/research-api/**'
      - 'libs/research-core/**'
      - 'platform/db/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/_quality-python.yml'
      - '.github/workflows/svc-research-api.quality.yml'
      # the engine's gRPC contract, which research-api carries a copy of (the protos job)
      - 'services/trade-ngin/proto/**'
      - 'services/trade-ngin/services/rpc/gen_versions.py'
  workflow_dispatch:

concurrency:
  group: svc-research-api-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality-python.yml
    with:
      path: services/research-api
      python-versions: '["3.11"]'
      runners: '["ubuntu-latest"]'
      coverage-min: 80
      strict-types: false
      build-check: false
    secrets: inherit

  # AlgoLens calls the engine with a copy of its protos; the engine refuses another major version,
  # so the copy must match services/trade-ngin exactly (decision 0031).
  protos:
    name: protos match the engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            services/research-api
            services/trade-ngin/proto
            services/trade-ngin/services/rpc/gen_versions.py
          sparse-checkout-cone-mode: false
      - run: sh services/research-api/scripts/sync_protos.sh --check

  gate:
    name: svc-research-api quality
    if: always()
    needs: [quality, protos]
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::quality result was ${{ needs.quality.result }}"
            exit 1
          fi
          if [ "${{ needs.protos.result }}" != "success" ]; then
            echo "::error::the vendored protos differ from services/trade-ngin (scripts/sync_protos.sh)"
            exit 1
          fi
