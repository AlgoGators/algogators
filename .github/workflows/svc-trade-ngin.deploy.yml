name: trade-ngin · deploy

# A push to `prod` is a production deploy of engine-rpc on the algocloud box,
# the whole live path (the QT desk, the catch-up scheduler and every model run):
# take the image main already built and tested for this commit, or, when there is
# none, run the quality gate (C++ build and tests) and the rpc checks and build and
# push the engine image here; then SSH in, fast-forward a sparse checkout of the deploy
# directory and roll to the new digest with services/trade-ngin/deploy/deploy.sh,
# which waits out engine runs and the 09:30 send / 10:00 cutoff and switches
# back if the new container is not healthy.
#
# Replaces trade-ngin's ci-cd-pipeline.yml deploy (#90), which restarted a
# `:latest` container that no longer runs. Rolling back is
# `deploy.sh <previous ref>` on the box (deploy.sh prints it), or re-running an
# earlier run of this workflow.

on:
  push:
    branches: [prod]
    # `prod` is shared with the AlgoLens and data-ngin deploys: only engine changes redeploy
    # engine-rpc. The workflow files are left out on purpose, as in svc-data-ngin.deploy.yml.
    paths:
      - services/trade-ngin/**
      - '!services/trade-ngin/docs/**'
      - '!services/trade-ngin/**/*.md'
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: true
      deploy:
        description: Deploy after building (only honoured on the prod branch).
        type: boolean
        default: false

# One prod deploy at a time, and never cancel one mid-roll.
concurrency:
  group: svc-trade-ngin-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `prod` is a fast-forward of main, and main already built and tested this commit
  # (svc-trade-ngin.quality.yml pushes sha-<commit> while its tests run). Deploy that image
  # when main's quality run for the commit succeeded, waiting for it if it is still running,
  # and the commit's rpc checks did not fail; otherwise build and test here.
  # A dry run always builds, since checking the build is what it is for.
  resolve:
    name: find main's image
    runs-on: ubuntu-latest
    # Main's quality run can still be testing; waiting for it beats building the commit again.
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: find
        if: ${{ !(inputs.dry-run || false) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ghcr.io/algogators/trade-ngin-engine:sha-${{ github.sha }}
        run: |
          if ! digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -re .digest); then
            echo "No image for ${GITHUB_SHA::8} on main yet: building it here."
            exit 0
          fi
          # The image is pushed alongside the tests, so it counts only once the run that pushed
          # it has passed.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/svc-trade-ngin.quality.yml/runs?head_sha=$GITHUB_SHA&event=push" \
                  --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id // empty')
          if [ -z "$run" ]; then
            echo "::warning::No main quality run for ${GITHUB_SHA::8}: building and testing here."
            exit 0
          fi
          if ! gh run watch "$run" -R "$GITHUB_REPOSITORY" --interval 30 --exit-status >/dev/null; then
            echo "::warning::main's quality run for ${GITHUB_SHA::8} did not pass: building and testing here."
            exit 0
          fi
          rpc=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/svc-trade-ngin.rpc.yml/runs?head_sha=$GITHUB_SHA&event=push" \
                  --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // "none"')
          case "$rpc" in
            success|none) ;;
            *) echo "::warning::main's rpc checks for ${GITHUB_SHA::8} ended '$rpc': building and testing here."
               exit 0 ;;
          esac
          echo "Deploying main's image $REF ($digest)."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  quality:
    needs: resolve
    if: ${{ needs.resolve.outputs.digest == '' }}
    uses: ./.github/workflows/_quality-cpp.yml
    with:
      path: services/trade-ngin
      builds: '[{"preset":"ci-gcc13","os":"ubuntu-24.04"}]'
      sanitizers: '[]'
      run-clang-tidy: false
      run-clang-format: false
    secrets: inherit

  rpc:
    needs: resolve
    if: ${{ needs.resolve.outputs.digest == '' }}
    uses: ./.github/workflows/svc-trade-ngin.rpc.yml

  image:
    needs: [quality, rpc]
    uses: ./.github/workflows/_publish-container.yml
    with:
      path: services/trade-ngin
      image: algogators/trade-ngin-engine
      push: ${{ !(inputs.dry-run || false) }}
      # The image compiles the engine and its tests from scratch.
      timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets: inherit

  deploy:
    # !cancelled(): image is skipped when main's image is deployed.
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/prod'
          && !(inputs.dry-run || false)
          && (github.event_name == 'push' || inputs.deploy)
          && (needs.resolve.outputs.digest != '' || needs.image.result == 'success') }}
    needs: [resolve, image]
    uses: ./.github/workflows/_deploy-ssh.yml
    with:
      image: algogators/trade-ngin-engine
      digest: ${{ needs.resolve.outputs.digest || needs.image.outputs.digest }}
      # Its own checkout: data-ngin's at /home/ubuntu/algogators is sparse on its deploy directory.
      remote-path: /home/ubuntu/algogators-trade-ngin
      deploy-script: services/trade-ngin/deploy/deploy.sh
      sparse-paths: services/trade-ngin/deploy
      # deploy.sh waits up to 45 minutes for a quiet moment, then up to 10 for the roll.
      timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    secrets: inherit
