name: security

# Repo-wide, not per-service. Security scanning does not respect directory
# boundaries — a vulnerable transitive dependency in one service is a repo
# problem — so this workflow has no path filters on its triggers.
#
# Every job is gated on actually finding code of the relevant kind, so the
# workflow stays green on a repo that has not had its services migrated in yet
# and lights up automatically as each one lands.
#
# Pull requests run every configured CodeQL language because code scanning
# protection expects all results before merge. Pushes filter by changed source
# or dependency files; scheduled runs scan every detected language.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 07:00 UTC. Scheduled runs catch advisories published against code
    # that has not changed, which is most of them.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Branch protection expects every configured CodeQL language on PRs.
          # Pushes filter by diff; schedules and unknown before-SHAs scan all.
          scan_all=false
          changed=""
          case "$EVENT_NAME" in
            push)
              if [ -z "$PUSH_BEFORE" ] || ! git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
                scan_all=true
              else
                changed=$(git diff --name-only "$PUSH_BEFORE" HEAD)
              fi
              ;;
            pull_request)
              scan_all=true
              ;;
            *)
              scan_all=true
              ;;
          esac

          find_src() { find libs apps services -type f -name "$1" -not -path '*/node_modules/*' 2>/dev/null | head -1; }
          touched() {
            [ "$scan_all" = true ] && return 0
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          langs=()
          [ -n "$(find_src '*.py')" ] && touched '(^|/)(pyproject\.toml|requirements[^/]*\.txt)$|^uv\.lock$|\.py$' && langs+=('"python"')
          [ -n "$(find_src '*.ts')$(find_src '*.tsx')$(find_src '*.js')$(find_src '*.jsx')" ] && touched '(^|/)package\.json$|^pnpm-lock\.yaml$|\.(ts|tsx|js|jsx|mjs|cjs)$' && langs+=('"javascript-typescript"')
          # Dependency-only pushes also need the C++ configuration on main.
          [ -n "$(find_src '*.cpp')$(find_src '*.hpp')$(find_src '*.cc')" ] && touched '\.(cpp|hpp|cc|h|cxx)$|(^|/)(pyproject\.toml|requirements[^/]*\.txt|package\.json)$|^(uv\.lock|pnpm-lock\.yaml)$' && langs+=('"c-cpp"')
          json="[$(IFS=,; echo "${langs[*]:-}")]"
          echo "languages=$json" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$json" = '[]' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "Detected: $json (scan_all=$scan_all)"

  codeql:
    name: codeql (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # build-mode none: C++ here needs the whole vcpkg dependency tree to
          # compile, which autobuild cannot provide; buildless extraction scans
          # the sources directly. Interpreted languages ignore this setting.
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licenses are incompatible with how this code is distributed.
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  sbom:
    name: sbom
    needs: detect
    if: ${{ github.event_name == 'push' && needs.detect.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: algogators-sbom.cyclonedx.json
          output-file: algogators-sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: algogators-sbom.cyclonedx.json
          retention-days: 90
