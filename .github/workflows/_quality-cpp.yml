name: quality / cpp

# Reusable. Called by every C++ member's `<kind>-<name>.quality.yml`.
#
# Unlike the Python and Node reusables this one does not go through `just` —
# CMake presets already are the abstraction, and duplicating them in a justfile
# would give two places to change a compiler flag. The presets live in the root
# CMakePresets.json.

on:
  workflow_call:
    inputs:
      path:
        description: Repo-relative path to the member, e.g. services/trade-ngin
        type: string
        required: true
      builds:
        description: >
          JSON array of {preset, os} objects. Explicit pairing rather than a
          cross-product: ci-msvc only makes sense on windows, ci-gcc13 only on
          ubuntu, and a cross-product would schedule six jobs to run three.
        type: string
        default: '[{"preset":"ci-gcc13","os":"ubuntu-latest"}]'
      sanitizers:
        description: JSON array of sanitizer preset names, e.g. ["ci-asan","ci-ubsan"]. Empty to skip.
        type: string
        default: '[]'
      run-clang-tidy:
        type: boolean
        default: true
      run-clang-format:
        description: >
          Off only for imported code that predates the style; reformatting it
          in one shot would conflict with every in-flight feature branch.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 60

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    if: ${{ inputs.run-clang-format }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          find "${{ inputs.path }}" \
            \( -path '*/build/*' -o -path '*/third_party/*' \) -prune -o \
            -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' -o -name '*.h' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror --style=file

  build:
    name: ${{ matrix.build.preset }}
    runs-on: ${{ matrix.build.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(inputs.builds) }}
    env:
      # vcpkg caches compiled dependencies in the Actions cache. Without this,
      # every job rebuilds Arrow from source and the matrix takes 45 minutes.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Export vcpkg cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Locate vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.build.preset }}
        working-directory: ${{ inputs.path }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build.preset }}
        working-directory: ${{ inputs.path }}

      - name: Test
        run: ctest --preset ${{ matrix.build.preset }}
        working-directory: ${{ inputs.path }}

      - name: clang-tidy
        # Runs off the compile database the configure step just produced, so it
        # sees exactly the flags the real build used.
        if: ${{ inputs.run-clang-tidy && runner.os == 'Linux' }}
        working-directory: ${{ inputs.path }}
        run: |
          run-clang-tidy -p "build/${{ matrix.build.preset }}" -quiet \
            $(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- '*.cpp' '*.cc' || true)

      - name: Slug
        id: slug
        if: always()
        shell: bash
        run: echo "value=$(echo '${{ inputs.path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ steps.slug.outputs.value }}-${{ matrix.build.preset }}
          path: ${{ inputs.path }}/build/${{ matrix.build.preset }}/Testing/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  sanitize:
    name: ${{ matrix.preset }}
    if: ${{ inputs.sanitizers != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.sanitizers) }}
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      # Sanitizer findings must fail the job, not scroll past in the log.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset ${{ matrix.preset }}
        working-directory: ${{ inputs.path }}
      - run: cmake --build --preset ${{ matrix.preset }}
        working-directory: ${{ inputs.path }}
      - run: ctest --preset ${{ matrix.preset }}
        working-directory: ${{ inputs.path }}
