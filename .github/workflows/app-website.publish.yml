name: app-website · publish

on:
  push:
    tags: ['website/v*']
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality-node.yml
    with:
      path: apps/website
      coverage-min: 50
      bundle-budget-kb: 500
    secrets: inherit

  publish:
    needs: quality
    uses: ./.github/workflows/_publish-static-site.yml
    with:
      path: apps/website
      target: pages
      dry-run: ${{ inputs.dry-run || false }}
    permissions:
      contents: read
      pages: write
      id-token: write
