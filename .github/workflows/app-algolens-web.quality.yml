name: algolens web · quality

on:
  pull_request:
    paths:
      - 'apps/algolens-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/_quality-node.yml'
      - '.github/workflows/app-algolens-web.quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/algolens-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/_quality-node.yml'
      - '.github/workflows/app-algolens-web.quality.yml'
  workflow_dispatch:

concurrency:
  group: app-algolens-web-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_quality-node.yml
    with:
      path: apps/algolens-web
      node-versions: '["20"]'
      runners: '["ubuntu-latest"]'
      coverage-min: 80
      bundle-budget-kb: 500
      e2e: false
    secrets: inherit

  gate:
    name: app-algolens-web quality
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::quality result was ${{ needs.quality.result }}"
            exit 1
          fi
