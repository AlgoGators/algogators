[project]
name = "platform-db"
version = "0.1.0"
description = "Shared database configuration and connection plumbing for AlgoGators services"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_db"]
