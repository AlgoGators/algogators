# Performance budgets and baselines for the AlgoGators monorepo.
# Generated by perf/phase-0-1-footprint Task 2.
#
# Format: [repo.probe.metric_id]
# - baseline: known baseline value, or "unset" if not yet captured
# - threshold: budget threshold as percentage of baseline (100 = baseline, 150 = 50% over)
# - action: human-readable action text for breaches

# ============================================================================
# Database Footprint Metrics
# ============================================================================

[db_footprint.raw_cleaned_ratio]
baseline = 1.3
threshold = 130
action = "Ensure data cleaning process maintains quality. If ratio exceeds 1.3 raw rows per cleaned row, investigate data quality and cleaning efficiency."

[db_footprint.index_share_pct]
baseline = "unset"
threshold = 100
action = "Baseline will be captured on first run. Monitor index size as percentage of total table size."

[db_footprint.growth_bytes_per_day]
baseline = "unset"
threshold = 100
action = "Baseline will be captured on second snapshot. If growth exceeds baseline after first capture, investigate data accumulation rate and retention policies."

