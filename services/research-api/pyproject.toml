[project]
name = "research-api"
version = "0.0.0"
description = "Shared research backend API for AlgoLens and AlgoTerminal"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["research-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_api"]
