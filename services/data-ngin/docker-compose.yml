# Run from this directory. Build contexts point at the repo root because the
# service depends on the workspace lib platform-db (not on PyPI); the code is
# INSTALLED into the images, no source volume-mounts needed.
services:

  airflow-init:
    build:
      context: ../..
      dockerfile: services/data-ngin/Dockerfile.airflow
    container_name: airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:algogators@172.31.23.190:5432/algo_data?options=-csearch_path%3Dairflow_metadata
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - airflow_data:/opt/airflow
    command: >
      bash -c "airflow db migrate &&
               airflow connections create-default-connections"

  airflow-webserver:
    build:
      context: ../..
      dockerfile: services/data-ngin/Dockerfile.airflow
    container_name: airflow-webserver
    restart: always
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:algogators@172.31.23.190:5432/algo_data?options=-csearch_path%3Dairflow_metadata
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - airflow_data:/opt/airflow
    ports:
      - "8080:8080"
    command: ["airflow", "webserver"]

  airflow-scheduler:
    build:
      context: ../..
      dockerfile: services/data-ngin/Dockerfile.airflow
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:algogators@172.31.23.190:5432/algo_data?options=-csearch_path%3Dairflow_metadata
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - airflow_data:/opt/airflow
    command: ["airflow", "scheduler"]

  api:
    build:
      context: ../..
      dockerfile: services/data-ngin/Dockerfile
    container_name: data-ngin-api
    restart: always
    environment: {}
      # DATA_NGIN_CONFIG_PATH: only set to override the packaged
      # data_ngin/config/config.yaml default.
      # DATA_NGIN_API_KEY: set this before exposing the API beyond localhost --
      # unset, the API-key check is disabled (see data_ngin/api/server.py).
    ports:
      - "8000:8000"

volumes:
  db_data:
  airflow_data:
