# Global components configuration
loader:
  class: "CSVLoader"
  module: "loader.csv_loader"
  file_path: "contracts/contract_valid.csv" # Change to contracts/contract_valid.csv if running locally, 
  # otherwise /opt/airflow/data_engine/contracts/contract_valid.csv

inserter:
  class: "OhlcvRepository"
  module: "repository.ohlcv_repository"

#Changed This
fetcher:
  class: "BatchDownloadDatabentoFetcher"
  module: "fetcher.batch_download_databento_fetcher"

cleaner:
  class: "DatabentoCleaner"
  module: "cleaner.databento_cleaner"

# Data provider configuration
provider:
  name: "databento"
  asset: "FUTURE"                   # FUTURE, EQUITY
  dataset: "GLBX.MDP3"              # XNAS.ITCH for equities, GLBX.MDP3 for futures (TO:DO: Add IFEU.IMPACT)
  schema: "OHLCV_1D"                # Only OHLCV_1D for now (TO:DO: Add OHLCV 1h, 1m and MBO)
  roll_type: "v"                    # Calendar = c, Open Interest = n, Volume = v
  contract_type: "0"                # AKA Rank: 0 = front, 1 = second, 2 = third, etc.

# Remap E-mini symbols to their Micro equivalents for DB storage (was a hardcoded
# dict duplicated in both fetcher classes; now a SymbolRemapper domain service
# consumes this table).
symbol_remap:
  ES: "MES"
  RTY: "M2K"
  NQ: "MNQ"
  YM: "MYM"

# Which asset type the back-adjustment (futures roll) algorithm runs for.
# Previously ran unconditionally, including for EQUITY rows, where it's meaningless.
back_adjustment:
  applies_to: "FUTURE"

# Database configuration
database:
  target_schema: "futures_data"
  raw_table: "ohlcv_1d_raw"           
  table: "ohlcv_1d"

# Time range for data fetching YYYY-MM-DD. Left empty so determine_date_range()
# (src/utils/dynamic_loader.py) does its incremental thing: start_date defaults
# to (latest date already in the DB + 1 day), end_date defaults to yesterday.
# Only hardcode real dates here for a one-off manual backfill; leaving a fixed
# range in place permanently is what silently disabled daily incremental
# fetching before (pipeline was stuck re-pulling 2010-06-06..2025-03-22 forever
# instead of picking up new days).
time_range:
  start_date: ""
  end_date: ""

# Options to handle missing data
missing_data:
  forward_fill: "False"
  backward_fill: "False"            
  interpolate: "False"
  drop_nan: "False"
  zero_fill: "True"
  mean_fill: "False"
  median_fill: "False"
  custom_fill: "False"
  custom_value: "0"

# Logging options
logging:
  level: "INFO"                           

batch_downloading:
  batch: True
  unit: "Daily"
  max_units: 30