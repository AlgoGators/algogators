[project]
name = "data-ngin"
version = "0.1.0"
description = "AlgoGators market-data ingestion service"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2.3,<3",
    "yfinance>=0.2.48,<0.3",
    "databento>=0.44.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=1.4.36,<2.0",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "strawberry-graphql[fastapi]>=0.253.0",
    "pyarrow>=18.1.0",
    "pydantic>=2.10.4,<3",
    "tzdata>=2024.2",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "slowapi>=0.1.9",
]
# apache-airflow is deliberately NOT a dependency: only dags/ (a deploy-time
# artifact for the Airflow image) imports it, and Airflow's pins conflict with
# the rest of the workspace. The Airflow deployment installs it in its own image.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_ngin"]
