# Live speech-to-text detection of mention-market words vs Kalshi repricing (backlog A3), offline 1x replay.
# Source: docs/ASR_LIVE_MENTION_DETECTION.md (scripts/research/asr_*.py, data/vendor/asr/)
- strategy_id: asr_youtube_asr_taker_yes
  name: Stream public YouTube live audio of FOMC pressers / earnings calls into streaming ASR (Deepgram nova-3, AssemblyAI v3), match contract grammar, buy YES before the market reprices
  venue: kalshi
  status: rejected
  evidence: docs/ASR_LIVE_MENTION_DETECTION.md
  verdict: "13 events: 7 FOMC and 6 Tesla/Netflix. Audio streamed at 1x. Deepgram interim latency is 0.43 s median (p90 0.87 s); AssemblyAI partials are 1.8-2.6 s. Precision/recall vs settlement: 0.91/0.98 (FOMC, with a diarized Chair filter) and 0.92/0.99 (earnings). FPs are mostly reporters and interviewers. Kalshi reprices each said word in ONE taker-YES sweep of the ask ladder, at a delay that is constant within an event (LOO MAD 0.25-1.4 s): an automated competitor. Absolute speech-to-sweep lag is not identified from archived VODs, because release_timestamp anchors are trimmed. But a VOD frame cannot be on YouTube before release + t, which gives a one-sided bound. On every event with an informative anchor, the sweep came BEFORE the audio was on YouTube: Tesla's own stream by 4.3 s, ABC (Dec FOMC) by 8.8 s, and the best FOMC rebroadcaster by 22-36 s (CNBC by 65 s). Lead <= -5.8 s even at zero viewer delay. The prize for whoever is first: median $163 net per word, about $1-3k per event, $116k over 12 events (85% in one event of 1c asks)."
  key_numbers: {dg_interim_latency_med_s: 0.43, dg_final_latency_med_s: 2.6, aai_partial_latency_med_s: 2.2, fed_precision_dg_int: 0.91, fed_recall_dg_int: 0.98, earn_precision_dg: 0.92, earn_recall_dg: 0.99, sweep_loo_mad_s: "0.25-1.4", lead_bound_tesla_s: -5.8, lead_bound_fomc_abc_s: -10.2, lead_bound_fomc_best_rebroadcast_s: "-24 to -36", prize_per_word_med_usd: 163, prize_total_12ev_usd: 115931, prize_ex_top_word_usd: 55584, fp_cost_dg_int_usd: -9931, audio_min_dg: 657.5, audio_min_aai: 159.7, est_spend_usd: 5.5, n_trials: 14}
  gaps: "No absolute anchor: Netflix, Tesla Q4-25 and Sep FOMC VODs are trimmed, so their lead is unbounded. Tape prints only, no recorder books (all events are before 2026-10-12). Deepgram balance not read (the admin-key call was denied by the permission classifier). Direct feeds (federalreserve.gov webcast, earnings dial-ins) are untested."
  next_tests: "Optional live paper run of scripts/research/asr_live.py on KXFEDMENTION-26OCT (Oct 28) with the federalreserve.gov direct webcast plus a YouTube control, to measure detection vs book sweep. Needs the user's go-ahead."
  retest_if: "A direct, non-YouTube low-latency feed measured live with asr_live.py shows detection (interim + 1 s order) before the book sweep on >= 50% of said words over >= 5 events."
