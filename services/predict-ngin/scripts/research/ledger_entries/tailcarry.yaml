  venue: kalshi
  status: rejected
  evidence: docs/TAILCARRY_LONG_DATED_NO_APY.md
  verdict: "Post-hoc diagnostic, not pre-registered. Per contract it is positive in both splits (train +2.4 to +2.8c, test +1.2c, CI > 0 under Fa/Fb/Fc). It does not survive sizing: at $10k it makes -$451 (Fa), -$13 (Fb) and +$218 (Fc) per year, with CIs spanning 0. Holds last 180-280 days, so even +1.2c on 96c is about 2%/yr on deployed capital, below Kalshi's APY on idle cash. 30-65% of test fills are in markets that are still open (marked at last price)."
