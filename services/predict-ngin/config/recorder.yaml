# Read-only order-book recorder config. See docs/RECORDER.md.
# The recorder NEVER places orders; it only calls public market-data endpoints.
#
# IDs: Kalshi = market ticker, Polymarket = CLOB token id (QUOTE them),
#      Polymarket US = market slug.
#
# Pair review 2026-10-12: every pair below was checked against the public market
# endpoints (Kalshi /markets/{ticker} rules_primary/secondary, Polymarket gamma
# question/description/gameStartTime, Polymarket US /v1/markets?slug= question/sides).
# status: verified     = same event, same date, same winning condition on all legs
#         needs-review = plausible but something (e.g. start time) does not line up exactly
# Residual rule differences are listed in `note` -- read them before booking P&L.
#
# Polymarket: only the FIRST-outcome token is recorded (yes_token). The second token's
# CLOB book is the exact complement (bid p <-> ask 1-p, same sizes -- visible in every
# price_change, which carries both assets), so recording it would double PM storage for
# no information. Add `no_token:` back if you want it anyway.
#
# Sports conventions: Polymarket game markets are TEAM outcomes; yes_token = first team
# in the PM slug. Polymarket US game books are priced in the first ("long") side, which
# is the first team in the US slug. The Kalshi leg is the same team.
# Sports rule differences common to all game pairs: if a game is CANCELLED, Kalshi
# resolves to a "fair price", Polymarket 50-50, Polymarket US per its own rules.
#
# Instruments: 10 pairs x 3 legs = 30 (10 Kalshi, 10 Polymarket, 10 Polymarket US).
# Games expire after they finish; re-run discovery / refresh this list every few days.

defaults:
  depth: 10                 # top-N levels stored per side
  ws_sample_interval_s: 1.0 # WS books are sampled at most this often (only if changed)
  heartbeat_s: 60           # unchanged books are still written this often
  flush_interval_s: 300     # buffer -> parquet part file
  output_dir: data/live_books

venues:
  kalshi:
    # auto = WS if KALSHI_API_KEY_ID + KALSHI_PRIVATE_KEY_PATH are set (and `cryptography`
    # is installed), else public REST polling (no key needed).
    mode: auto
    rest_poll_interval_s: 2.0
    max_requests_per_s: 8        # Basic tier ~20 reads/s; leave headroom (REST fallback only)
    trades_poll_interval_s: 15
    max_markets_per_conn: 1000   # discovered markets per WS connection (static pairs get their own)
    silence_audit_s: 120         # WS: REST-check books silent this long (0 = off); mismatch -> reconnect shard
    audit_interval_s: 60
    audit_max_per_round: 10      # <= 10 REST reads/min at 1 req/s
  polymarket:
    mode: ws                     # public market WS, no key
    max_requests_per_s: 10       # REST resync only
    resync_interval_s: 600       # full REST snapshot every 10 min as integrity check
  polymarket_us:
    mode: rest                   # public gateway REST; WS needs a KYC'd API key
    rest_poll_interval_s: 2.0    # 10 slugs / 2 s = 5 req/s
    max_requests_per_s: 8        # 25 req/s per IP limit

pairs:
  # ---------------------------------------------------------------- macro / Fed
  # FOMC Oct 27-28, 2026. Kalshi "Hike of 0bps on Oct 28" / PM "no change after the
  # October 2026 meeting" / US "does not change the upper bound ... October 2026 FOMC".
  # Off-grid moves: PM rounds UP to the nearest 25; US rounds to the nearest listed option;
  # Kalshi brackets are exact -- irrelevant unless the Fed moves by a non-multiple of 25.
  - name: fed-2026-10-hold
    status: verified
    kalshi: {ticker: KXFEDDECISION-26OCT-H0}
    polymarket:
      yes_token: "111061902544814266207267295505639408607400625795891618462682726460921782993748"
    polymarket_us: {slug: rdc-usfed-fomc-2026-10-28-nochng, outcome: "yes"}
