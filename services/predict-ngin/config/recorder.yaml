markets: []
  # single-venue markets (maker-opportunity study only), e.g.
  # - {venue: kalshi, ticker: KXFEDDECISION-26OCT-C25}

# ------------------------------------------------------------------ discovery
# Rolling, series-based subscriptions (see docs/RECORDER.md "Discovery"). Each group is
# re-queried every refresh_s; markets that stop qualifying are unsubscribed, and every
# market is dropped locally close_grace_s after its close_time. Series tickers verified
# against GET /series and open events on 2026-10-13.
discovery:
  close_grace_s: 120
  series_scan_s: 21600          # category groups: re-scan which series have open events (6 h)
  kalshi:
    max_requests_per_s: 1.0     # discovery REST budget; other research processes share this IP
    groups:
      # --- crypto: 15-minute up/down (listed ahead as `unopened`, so the next window is
      #     subscribed before it opens)
      - {name: k-crypto-15m, series: [KXBTC15M, KXETH15M, KXSOL15M], refresh_s: 60,
         max_hours_to_close: 0.6, include_unopened: true}
      # --- crypto above/below: current + next hour, nearest strikes only (300-400 per series)
      - {name: k-crypto-hourly, series: [KXBTCD, KXETHD, KXSOLD], refresh_s: 60,
         max_hours_to_close: 1.2, include_unopened: true, nearest_strikes: 10}
      # ...and the 5pm-ET daily / Friday weekly events of the same series
      - {name: k-crypto-daily, series: [KXBTCD, KXETHD, KXSOLD], refresh_s: 300,
         max_hours_to_close: 30, nearest_strikes: 12}
      # --- index: hourly above/below (KXNASDAQ100U alone has ~2,800 open markets)
      - {name: k-index-hourly, series: [KXINXU, KXNASDAQ100U], refresh_s: 60,
         max_hours_to_close: 4, nearest_strikes: 10}
      - {name: k-index-daily, series: [KXINX, KXNASDAQ100], refresh_s: 300,
         max_hours_to_close: 30, nearest_strikes: 12}
      # --- commodities (daily)
      - {name: k-commodities, series: [KXWTI, KXGOLDD, KXBRENTD], refresh_s: 300,
         max_hours_to_close: 30, nearest_strikes: 12}
      # --- econ releases + Fed (CPI Oct 14 12:30Z, FOMC Oct 28, payrolls, claims, GDP, PCE).
      #     KXAAAGASD (daily AAA gas) had no open event on 2026-10-13; it is picked up
      #     automatically when one opens. KXAAAGASW is the weekly version.
      - name: k-econ
        series: [KXCPI, KXCPICORE, KXCPIYOY, KXCPICOREYOY, KXFEDDECISION, KXFED, KXRATECUT,
                 KXRATECUTCOUNT, KXPAYROLLS, KXU3, KXJOBLESSCLAIMS, KXGDP, KXPCECORE, KXPCEHEAD,
                 KXAAAGASD, KXAAAGASW]
        refresh_s: 600
        max_hours_to_close: 2000      # ~83 days: next two Fed meetings / CPI prints; drops 2027 contracts
        heartbeat_s: 120
      # --- weather: daily high temperature, the 18 cities ForecastEx also lists
      #     (station-matched in docs/FIN_E_FORECASTEX_XVENUE_2026-10-13.md; NYC/Denver excluded there)
      - name: k-weather-high
        series: [KXHIGHAUS, KXHIGHCHI, KXHIGHLAX, KXHIGHMIA, KXHIGHPHIL, KXHIGHTATL, KXHIGHTBOS,
                 KXHIGHTDAL, KXHIGHTDC, KXHIGHTHOU, KXHIGHTLV, KXHIGHTMIN, KXHIGHTNOLA, KXHIGHTOKC,
                 KXHIGHTPHX, KXHIGHTSATX, KXHIGHTSEA, KXHIGHTSFO]
        refresh_s: 900
        max_hours_to_close: 48
        depth: 5
      # --- daily rain (multi-city, launched 2026-07-16; largest weather series). Its trace=0 rule was
      #     mispriced for ~6 weeks after launch (docs/SETTLE_PROXY_PARTIAL_INFO_2026-10-15.md); recorded
      #     so the next settlement-rule change can be studied live from day one.
      - {name: k-weather-rain, series: [KXRAIN], refresh_s: 900, max_hours_to_close: 48, depth: 5}
      # --- mention markets ("will X say Y"): every series in Kalshi's Mentions category that
      #     has an open event (76 series / ~1,350 markets on 2026-10-13). For the NO-maker audit:
      #     trades + top-of-book depth; quiet books heartbeat every 5 min.
      - {name: k-mentions, category: Mentions, refresh_s: 900, depth: 5, heartbeat_s: 300}
      # --- sports combo legs: player props and game lines (C1 prop-leg quoting / combo-leg LIP / parlay5
      #     paper quotes; docs/PARLAY5_COMBO_OVERPRICING_2026-10-15.md §8). User-approved 2026-10-15.
      #     Sports close_time sits ~45 h after expected expiration (checked 2026-10-15 on live markets),
      #     so max_hours_to_close 60 starts recording ~15 h before the game ends.
      - name: k-sports-props
        series: [KXNFLANYTD, KXNFLRECYDS, KXNFLPASSYDS, KXNFLRSHYDS, KXNFLREC, KXNFLPASSTDS, KXNFL2TD,
                 KXNFLFIRSTTD, KXNBAPTS, KXNBAREB, KXNBA3PT, KXNBAAST, KXNBASTL, KXNBABLK]
        refresh_s: 600
        max_hours_to_close: 60
        depth: 5
        heartbeat_s: 120
        track_settlement: true
      - name: k-sports-lines
        series: [KXNFLGAME, KXNFLSPREAD, KXNFLTOTAL, KXNBAGAME, KXNBASPREAD, KXNBATOTAL,
                 KXNHLGAME, KXNHLSPREAD, KXNHLTOTAL, KXNCAAMBGAME]
        refresh_s: 600
        max_hours_to_close: 60
        nearest_strikes: 6
        depth: 5
        heartbeat_s: 120
        track_settlement: true
      # --- 2026 US midterm general elections (Nov 3, 2026; docs/ELEX_ELECTIONS_2026-10-14.md §7).
      #     Race winners: every Elections-category series matching series_regex that has an open
      #     event, 2026 events only (SENATEGA-28 etc. are dropped by event_regex). No primaries:
      #     those live in other series. ~980 markets on 2026-10-14 (KXHOUSERACE ~707).
      #     Books every 5 s (on change) normally; 1 s on election night (window below covers
      #     both 18:00 ET Nov 3 and the pre-registered 22:00Z start, through 12:00 ET Nov 4).
      #     Close/settlement times -> settlement: below.
      - name: k-elex-races
        category: Elections
        series_regex: '^(CONTROL[HS]|SENATE[A-Z]{2}S?|GOVPARTY[A-Z]{2}|HOUSE[A-Z]{2}\d+|KXHOUSERACE)$'
        event_regex: '-(26|2026)$'
        refresh_s: 1800
        depth: 5
        heartbeat_s: 300
        sample_interval_s: 5
        sample_windows:
          - {start: "2026-11-03T17:00:00-05:00", end: "2026-11-04T12:00:00-05:00", interval_s: 1, heartbeat_s: 30}
        track_settlement: true
      # --- chamber control / seat counts / combos for the 2026 Congress (events -27, -27FEB,
      #     -27JAN03, -27NOV03; the -29 / POWER-28 events are later cycles). ~90 markets.
      - name: k-elex-control
        series: [KXBALANCEPOWERCOMBO, KXDSENATESEATS, RSENATESEATS, KXDHOUSESEATS, KXRHOUSESEATS,
                 KXDSENATESEATSH, KXHOUSEPOPVOTEMARGIN, KXBLUEWAVECOMBO, KXBLUETSUNAMICOMBO,
                 KXCLOSESTSENATE]
        event_regex: '-27([A-Z]{3}(\d{2})?)?$'
        refresh_s: 1800
        depth: 5
        heartbeat_s: 300
        sample_interval_s: 5
        sample_windows:
          - {start: "2026-11-03T17:00:00-05:00", end: "2026-11-04T12:00:00-05:00", interval_s: 1, heartbeat_s: 30}
        track_settlement: true
      # --- Kalshi Liquidity Incentive Program (LIP) markets for the lipfwd forward test
      #     (docs/LIPFWD_PREREG_2026-10-15.md). Every market listed by the public
      #     GET /incentive_programs (active + upcoming within 25 min, so a 15-minute window is
      #     subscribed before it opens), ranked by reward $/day, top max_markets only.
      #     depth 15 reaches the 1,000-contract LIP target on 99.6% of book sides (probe of 600
      #     markets, 2026-10-14). Programme snapshots -> data/live_books/kalshi/*/lip-HH.parquet.
      #     Markets already in another group keep that group's settings but get depth 15.
      - name: k-lip
        incentives: true
        refresh_s: 1200
        incentive_lookahead_s: 1500
        max_markets: 1500
        min_reward_per_day: 1.0
        depth: 15
        heartbeat_s: 120
        track_settlement: true
      # --- PROPOSED 2026-10-15 (UFLOW S3 opening-quote study; not yet deployed to atlas -- the
      #     recorder only picks this up after a code update + restart, which needs user approval).
      #     Every event of Indiana / Wisconsin / national daily AAA gas and the NYC daily high, from
      #     before the official open (include_unopened; gas events open 08:00 ET and close 23:59 ET,
      #     KXHIGHNY opens 10:00 ET the day before) through close, so open+2h is always covered.
      #     docs/UFLOW_RESEARCH_DESIGN_2026-10-15.md needs 30 opening dates per series.
      #     Series checked via GET /series/{ticker} 2026-10-15: all four exist, quadratic fees,
      #     17 strikes per gas event, 6 per KXHIGHNY event (~75 markets total).
      #     Caveats: (1) KXAAAGASD is also in k-econ/k-lip, and a market held by several groups keeps
      #     the FIRST group's heartbeat/sampling (only depth is maxed), so heartbeat_s 30 may not apply
      #     there; (2) whether status=unopened lists gas/weather events before open is unverified
      #     (k-lip saw KXAAAGASD-26OCT16 at 07:50:49 ET, 9 min before open, via /incentive_programs).
      #     Discovery cost: 4 series x 2 statuses / 60 s = 0.13 req/s of the 1.0 req/s budget.
      - name: k-uflow-open
        series: [KXAAAGASDIN, KXAAAGASDWI, KXAAAGASD, KXHIGHNY]
        refresh_s: 60
        include_unopened: true
        max_hours_to_close: 48
        depth: 15
        heartbeat_s: 30
        track_settlement: true
  polymarket:
    max_requests_per_s: 2.0
    groups:
      # Crypto up/down (knowledge only). First outcome token ("Up") only; its book is the
      # exact complement of "Down". bbo events off (the 1 s books carry the touch).
      # 5m books burst ~1,000+ msgs/s; Polymarket drops such a connection now and then
      # ("1013 slow consumer"), so each group has its own WS and 5m keeps only current + next.
      - {name: pm-crypto-5m, tags: [5M], slug_regex: '^(btc|eth|sol)-updown-5m-', refresh_s: 60,
         max_hours_to_close: 0.15, depth: 5}
      - {name: pm-crypto-15m, tags: [15M], slug_regex: '^(btc|eth|sol)-updown-15m-', refresh_s: 60,
         max_hours_to_close: 0.5, depth: 5}
      - {name: pm-crypto-1h, tags: [1H], slug_regex: '^(bitcoin|ethereum|solana)-up-or-down-',
         refresh_s: 120, max_hours_to_close: 1.2, depth: 5}
      - {name: pm-crypto-4h, tags: [4h], slug_regex: '^(btc|eth|sol)-updown-4h-', refresh_s: 300,
         max_hours_to_close: 4.2, depth: 5}

# ------------------------------------------------------------------ settlement log
# Kalshi status/result changes (close, determination, settlement time) for every market of a
# group with track_settlement: true -> data/live_books/kalshi/*/status-HH.parquet.
# GET /markets?tickers=... (100 per request, <= 1 req/s): ~11 requests per sweep for ~1,070 markets.
settlement:
  enabled: true
  interval_s: 3600          # hourly
  fast_interval_s: 300      # every 5 min from election night through Nov 10 (ET)
  fast_windows:
    - {start: "2026-11-03T18:00:00-05:00", end: "2026-11-11T00:00:00-05:00"}
  max_requests_per_s: 1.0
  batch: 100

# ------------------------------------------------------------------ Polymarket RTDS
# Public real-time data socket: Chainlink reference prices (settlement source of the PM
# crypto up/down markets) and Binance prices. -> data/live_books/polymarket_rtds/*/prices-HH
rtds:
  enabled: true
  url: wss://ws-live-data.polymarket.com
  topics:
    - {topic: crypto_prices_chainlink, symbols: [btc/usd, eth/usd, sol/usd]}
    - {topic: crypto_prices, symbols: [btcusdt, ethusdt, solusdt]}
